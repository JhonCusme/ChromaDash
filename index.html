<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080818" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Inline SVG favicon — no extra HTTP request, eliminates 404 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23080818'/><rect x='6' y='6' width='20' height='20' rx='4' fill='%2300AAFF'/><rect x='11' y='11' width='10' height='10' rx='2' fill='%2300FF99'/><circle cx='16' cy='16' r='3' fill='white'/></svg>" />

  <!-- SEO -->
  <title>ChromaDash — Color Match Runner</title>
  <meta name="description" content="ChromaDash: Tap to match colors, dodge obstacles, and run as far as you can! The ultimate hyper-casual color-matching runner game." />
  <meta name="keywords" content="chromadash, color match, runner game, hyper casual, mobile game" />

  <!-- Open Graph -->
  <meta property="og:title" content="ChromaDash — Color Match Runner" />
  <meta property="og:description" content="Tap to match colors and run forever!" />
  <meta property="og:type" content="website" />

  <!-- Preload critical font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Pre-game loading screen (shown before Phaser boots) -->
  <div id="loading-screen">
    <div id="loading-title">CHROMA</div>
    <div id="loading-subtitle">DASH</div>
    <div id="loading-bar-container">
      <div id="loading-bar"></div>
    </div>
  </div>

  <!-- Phaser game canvas will be injected here -->
  <div id="game-container"></div>

  <!-- Phaser 3 via CDN (pinned LTS version) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>

  <!-- Capacitor core (handles native bridge when running as Android/iOS app) -->
  <!-- This file is generated by Capacitor when you run: npx cap sync -->
  <!-- In browser mode, this gracefully does nothing -->
  <script>
    // Capacitor bridge — loaded dynamically so it doesn't break browser mode
    if (window.Capacitor) {
      console.log('[App] Running in Capacitor native mode:', window.Capacitor.getPlatform());
    } else {
      console.log('[App] Running in browser mode');
    }

    // Animate the pre-load bar
    let progress = 0;
    const bar = document.getElementById('loading-bar');
    const tick = setInterval(() => {
      progress = Math.min(progress + Math.random() * 15, 90);
      if (bar) bar.style.width = progress + '%';
    }, 120);

    // Hide loading screen once Phaser is ready
    window.addEventListener('load', () => {
      clearInterval(tick);
      if (bar) bar.style.width = '100%';
      setTimeout(() => {
        const screen = document.getElementById('loading-screen');
        if (screen) {
          screen.classList.add('hidden');
          setTimeout(() => screen.remove(), 600);
        }
      }, 400);
    });
  </script>

  <!-- Game entry point (ES module) -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
